<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lunara · Mejoras</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #fbf6f8; --surface: #fff; --line: #eadde3; --text: #2b1b24; --muted: #85707b; --primary: #d9467a; --soft: #fde7ef; --ok: #1f8a5b; --warn: #b8650f; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17111a; --surface: #221a26; --line: #3a2f3f; --text: #f3e9ef; --muted: #ad9aa6; --primary: #f2729f; --soft: #3a2131; --ok: #4cc38a; --warn: #f0a24b; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, textarea, button { font: inherit; color: inherit; }
  input, select, textarea { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  textarea { width: 100%; min-height: 60px; resize: vertical; }
  button { border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer; background: var(--soft); color: var(--primary); font-weight: 600; }
  button.primary { background: var(--primary); color: #fff; }
  button.danger { background: transparent; color: #c0392b; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 12px 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 16px 0; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; text-align: left; color: var(--text); font-weight: 400; }
  .stat.on { border-color: var(--primary); background: var(--soft); }
  .stat b { display: block; font-size: 1.4rem; }
  .meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .85rem; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--primary); font-size: .78rem; font-weight: 600; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; }
  .saved { color: var(--ok); font-size: .85rem; }
  .err { color: #c0392b; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Buzón de mejoras</h1>
  <p class="muted">Sugerencias enviadas desde Lunara. Las usuarias ven el estado y tu respuesta en “Mis sugerencias”.</p>

  <form id="login" class="card row">
    <input id="key" type="password" placeholder="Clave de administración" autocomplete="current-password" style="flex:1;min-width:200px">
    <button class="primary">Entrar</button>
    <span id="loginErr" class="err"></span>
  </form>

  <section id="app" hidden>
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <select id="cat"><option value="">Todos los tipos</option><option value="feature">Nueva función</option><option value="improve">Mejora</option><option value="bug">Algo falla</option><option value="other">Otro</option></select>
        <input id="q" type="search" placeholder="Buscar…">
      </div>
      <div class="row"><button id="reload">Actualizar</button><button id="logout" class="danger">Salir</button></div>
    </div>
    <div id="stats" class="stats"></div>
    <div id="list"></div>
  </section>
</main>
<script>
  const STATUS = { new: 'Recibida', review: 'En revisión', planned: 'Planeada', done: 'Hecha', declined: 'Descartada' };
  const CAT = { feature: 'Nueva función', improve: 'Mejora', bug: 'Algo falla', other: 'Otro' };
  const GOAL = { track: 'Seguir ciclo', conceive: 'Busca embarazo', pregnant: 'Embarazada' };
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let key = '';
  try { key = sessionStorage.getItem('lunara-admin') || ''; } catch {}
  let items = [];
  let filter = 'new';

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${key}`, ...(opts.headers || {}) } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || `Error ${res.status}`), { status: res.status });
    return data;
  }

  async function load() {
    try {
      items = (await api('/api/feedback?admin=1')).items;
      $('#login').hidden = true; $('#app').hidden = false;
      try { sessionStorage.setItem('lunara-admin', key); } catch {}
      render();
    } catch (e) {
      $('#login').hidden = false; $('#app').hidden = true;
      $('#loginErr').textContent = e.status === 401 ? 'Clave incorrecta' : e.message;
    }
  }

  function render() {
    const counts = { all: items.length };
    Object.keys(STATUS).forEach((s) => { counts[s] = items.filter((i) => i.status === s).length; });
    $('#stats').innerHTML = [['all', 'Todas'], ...Object.entries(STATUS)].map(([k, l]) =>
      `<button class="stat ${filter === k ? 'on' : ''}" data-filter="${k}"><b>${counts[k]}</b>${l}</button>`).join('');
    const cat = $('#cat').value, q = $('#q').value.trim().toLowerCase();
    const shown = items.filter((i) => (filter === 'all' || i.status === filter) && (!cat || i.category === cat)
      && (!q || `${i.text} ${i.contact} ${i.reply}`.toLowerCase().includes(q)));
    $('#list').innerHTML = shown.length ? shown.map((i) => `
      <article class="card" data-id="${esc(i.id)}">
        <div class="meta">
          <span><span class="tag">${CAT[i.category] || i.category}</span> ${new Date(i.createdAt).toLocaleString('es')}</span>
          <span class="muted">${[GOAL[i.goal], esc(i.platform), i.version && `v${esc(i.version)}`].filter(Boolean).join(' · ')}</span>
        </div>
        <p class="text">${esc(i.text)}</p>
        ${i.contact ? `<p class="muted">Contacto: <b>${esc(i.contact)}</b></p>` : ''}
        <textarea data-reply placeholder="Respuesta visible para la usuaria (opcional)">${esc(i.reply)}</textarea>
        <div class="row" style="margin-top:8px">
          <select data-status>${Object.entries(STATUS).map(([k, l]) => `<option value="${k}" ${i.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
          <button class="primary" data-save>Guardar</button>
          <button class="danger" data-del>Borrar</button>
          <span class="saved" data-msg></span>
        </div>
      </article>`).join('') : '<p class="muted">No hay sugerencias aquí.</p>';
  }

  $('#login').addEventListener('submit', (e) => { e.preventDefault(); key = $('#key').value.trim(); $('#loginErr').textContent = ''; load(); });
  $('#logout').addEventListener('click', () => { key = ''; try { sessionStorage.removeItem('lunara-admin'); } catch {} $('#app').hidden = true; $('#login').hidden = false; });
  $('#reload').addEventListener('click', load);
  $('#cat').addEventListener('change', render);
  $('#q').addEventListener('input', render);
  $('#stats').addEventListener('click', (e) => { const b = e.target.closest('[data-filter]'); if (b) { filter = b.dataset.filter; render(); } });
  $('#list').addEventListener('click', async (e) => {
    const card = e.target.closest('[data-id]');
    if (!card) return;
    const id = card.dataset.id;
    const msg = card.querySelector('[data-msg]');
    try {
      if (e.target.matches('[data-save]')) {
        const { item } = await api('/api/feedback-admin', { method: 'POST', body: JSON.stringify({ id, status: card.querySelector('[data-status]').value, reply: card.querySelector('[data-reply]').value }) });
        items = items.map((i) => (i.id === id ? item : i));
        msg.textContent = 'Guardado ✓';
        setTimeout(render, 900);
      } else if (e.target.matches('[data-del]')) {
        if (!confirm('¿Borrar esta sugerencia? No se puede deshacer.')) return;
        await api('/api/feedback-admin', { method: 'POST', body: JSON.stringify({ id, action: 'delete' }) });
        items = items.filter((i) => i.id !== id);
        render();
      }
    } catch (err) { msg.textContent = ''; alert(err.message); }
  });
  if (key) load();
</script>
</body>
</html>
